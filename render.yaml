# Render Blueprint — deploy SelectStar to Render in one click.
# https://render.com/docs/blueprint-spec
#
# After pushing this file to your repo, go to:
#   Dashboard → New → Blueprint → select this repo
# Render will read this file and create the service for you.

services:
  - type: web
    name: selectstar
    runtime: docker
    plan: free  # upgrade to 'starter' for always-on + more RAM
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The LLM credentials are baked into the Dockerfile as defaults, but
      # you can override them here if you want to use a different provider.
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # LLM_API_KEY — set this in the Render dashboard as a secret env var.
      # - key: LLM_API_KEY
      #   sync: false
      - key: DATABASE_URL
        value: file:/app/db/custom.db
      - key: DEMO_DB_PATH
        value: /app/db/demo.db
      # NOTE: do NOT set PORT here — Render injects its own $PORT
      # (usually 10000) and health-checks against it. Hardcoding
      # PORT=3000 makes the app listen on the wrong port and the
      # deploy hangs after "Starting SelectStar…".
    # Persistent disk so sessions + the app DB survive redeploys.
    # Available on the 'starter' plan and above (not 'free').
    # To use a persistent disk, upgrade plan to 'starter' and uncomment:
    # disk:
    #   name: selectstar-data
    #   mountPath: /app/db
    #   sizeGB: 1

