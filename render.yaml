# Render Blueprint — SelectStar
# https://render.com/docs/blueprint-spec
#
# This file tells Render how to build and run the service. It's safe to delete
# if you already have a Render service configured manually with the same
# build/start commands — Render will use whatever you've set in the dashboard
# over this file.
#
# IMPORTANT — DATABASE_URL on Render:
#   SQLite needs a Persistent Disk so the file survives redeploys. The disk
#   below is mounted at /opt/render/project/src/.data — set DATABASE_URL in
#   the Render dashboard (NOT in .env) to:
#     file:/opt/render/project/src/.data/custom.db
#   This will override the .env value on Render.
#
#   If you'd rather use Postgres, change prisma/schema.prisma's `provider`
#   to "postgresql" and set DATABASE_URL to the Render Postgres internal
#   connection string.

services:
  - type: web
    name: selectstar
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bun run db:generate && bun run build
    startCommand: bun run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render will pick up .env from the repo too, but explicit env vars
      # override .env. Set the secrets below in the dashboard — keep them
      # out of git.
      - key: DATABASE_URL
        # Override .env's relative path with the absolute path on the
        # persistent disk. Set this in the dashboard if you'd rather.
        value: file:/opt/render/project/src/.data/custom.db
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        # Secret — set this in the Render dashboard, NOT here.
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: selectstar-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
